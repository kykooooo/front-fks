name: Firestore Rules

# Tests des Firestore Security Rules via l'émulateur (projet demo, 100 % hors ligne).
# Aucun credential Firebase requis : `demo-fks-rules` fonctionne sans réseau.

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore-tests/**
      - firebase.json
      - package.json
      - yarn.lock
      - .github/workflows/firestore-rules.yml
  pull_request:
    branches: [main]
    paths:
      - firestore.rules
      - firestore-tests/**
      - firebase.json
      - package.json
      - yarn.lock
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Firestore Rules tests
        run: yarn test:rules
