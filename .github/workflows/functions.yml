name: Cloud Functions

# Build + tests des Cloud Functions (projection coach-safe).
# Tests d'intégration via l'émulateur Firestore (projet demo, 100 % hors ligne).
# Aucun credential Firebase de production requis.

on:
  push:
    branches: [main]
    paths:
      - functions/**
      - firebase.json
      - .github/workflows/functions.yml
  pull_request:
    branches: [main]
    paths:
      - functions/**
      - firebase.json
      - .github/workflows/functions.yml
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Dépendances racine (fournit firebase-tools pour emulators:exec).
      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      # Dépendances Functions (lockfile dédié).
      - name: Install Functions dependencies
        run: yarn --cwd functions install --frozen-lockfile

      - name: Build Functions
        run: yarn functions:build

      - name: Unit tests (projecteur pur)
        run: yarn functions:test

      - name: Integration tests (Firestore Emulator)
        run: yarn functions:test:integration
